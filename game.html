<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра «Поймай кота»</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="game-page">

  <svg width="0" height="0" style="position:absolute">
    <symbol id="robot" viewBox="0 0 80 90">
      <line x1="40" y1="14" x2="40" y2="4" stroke="#22252b" stroke-width="3"/>
      <circle cx="40" cy="5" r="4" fill="#f25f4c" stroke="#22252b" stroke-width="2.5"/>
      <rect x="10" y="14" width="60" height="44" rx="8" fill="#7fc8d3" stroke="#22252b" stroke-width="3"/>
      <rect x="4" y="28" width="6" height="14" rx="2" fill="#f2c14e" stroke="#22252b" stroke-width="2.5"/>
      <rect x="70" y="28" width="6" height="14" rx="2" fill="#f2c14e" stroke="#22252b" stroke-width="2.5"/>
      <circle cx="28" cy="34" r="7" fill="#fff" stroke="#22252b" stroke-width="2.5"/>
      <circle cx="52" cy="34" r="7" fill="#fff" stroke="#22252b" stroke-width="2.5"/>
      <circle cx="29" cy="35" r="3" fill="#22252b"/>
      <circle cx="53" cy="35" r="3" fill="#22252b"/>
      <path d="M30 47 q10 7 20 0" fill="none" stroke="#22252b" stroke-width="3" stroke-linecap="round"/>
      <rect x="20" y="62" width="40" height="24" rx="5" fill="#f2c14e" stroke="#22252b" stroke-width="3"/>
      <rect x="33" y="69" width="14" height="10" rx="2" fill="#fff" stroke="#22252b" stroke-width="2"/>
    </symbol>
  </svg>

  <header class="top">
    <div class="logo">Мой первый сайт</div>
    <nav class="stages" id="stages"></nav>
    <div class="player"><span id="playerName"></span> <button class="reset" id="resetBtn" title="Начать заново для нового ученика">↺</button></div>
  </header>

  <main class="layout">
    <section class="left">
      <div class="robot">
        <svg class="robot-face"><use href="#robot"/></svg>
        <div class="bubble" id="bubble"></div>
      </div>

      <div class="code-card">
        <div class="code-head"><span class="file js">game.js</span></div>
        <div class="code game-code" id="code"></div>
      </div>

      <div class="actions">
        <button class="run" id="playBtn">▶ Запустить игру</button>
      </div>

      <div class="choice-groups" id="choices"></div>
    </section>

    <section class="right">
      <div class="browser">
        <div class="browser-bar"><i></i><i></i><i></i><div class="address">моя-игра.рф</div></div>
        <div class="hud">
          <span>Время: <b id="timeLeft">30</b></span>
          <span>Очки: <b id="score">0</b></span>
          <span>За поимку: <b id="perCatch">0</b></span>
        </div>
        <div class="arena" id="arena">
          <img id="target" class="target hidden" alt="Лови!" draggable="false">
          <div class="arena-msg" id="arenaMsg"><span>Настрой игру в коде и нажми <b>▶ Запустить игру</b></span></div>
        </div>
      </div>
      <div class="records">
        <h3>Рекорды этого компьютера</h3>
        <ol id="records"></ol>
      </div>
    </section>
  </main>

  <script src="levels.js"></script>
  <script src="nav.js"></script>
  <script src="game.js"></script>
</body>
</html>
